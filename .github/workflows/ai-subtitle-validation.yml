name: AI Subtitle Validation

on:
  push:
    branches:
      - feature/ai-bilingual-subtitles
    tags:
      - ai-subtitle-test-*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-subtitle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint, and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code and submodules
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Run common unit tests
        run: ./gradlew :common:testStbetaDebugUnitTest

      - name: Lint beta release
        run: ./gradlew lintStbetaRelease

      - name: Assemble beta release
        run: ./gradlew assembleStbetaRelease

      - name: Sign and verify test APKs
        env:
          AI_SIGNING_KEY: ${{ secrets.AI_SUBTITLE_SIGNING_KEY }}
          AI_SIGNING_PASSWORD: ${{ secrets.AI_SUBTITLE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/ai-subtitle-test.jks"
          trap 'rm -f "$key_file"' EXIT
          if [[ -n "$AI_SIGNING_KEY" && -n "$AI_SIGNING_PASSWORD" ]]; then
            printf '%s' "$AI_SIGNING_KEY" | base64 --decode > "$key_file"
          elif [[ "$GITHUB_REF" == refs/tags/ai-subtitle-test-* ]]; then
            echo "::error::Test release signing secrets are required. Refusing to publish unsigned APKs."
            exit 1
          else
            # Untrusted PRs use a temporary key; releases always use the persistent test key.
            export AI_SIGNING_PASSWORD="$(openssl rand -hex 32)"
            keytool -genkeypair -keystore "$key_file" -storetype JKS \
              -alias ai-subtitle-test -storepass:env AI_SIGNING_PASSWORD \
              -keypass:env AI_SIGNING_PASSWORD -keyalg RSA -keysize 3072 \
              -validity 10000 -dname "CN=SmartTube AI Subtitle Test"
          fi
          chmod 600 "$key_file"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          for apk in smarttubetv/build/outputs/apk/stbeta/release/*.apk; do
            "$build_tools/apksigner" sign --ks "$key_file" --ks-key-alias ai-subtitle-test \
              --ks-pass env:AI_SIGNING_PASSWORD --key-pass env:AI_SIGNING_PASSWORD "$apk"
            "$build_tools/apksigner" verify --verbose "$apk"
          done

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-subtitle-validation-reports-${{ github.run_number }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          if-no-files-found: warn

      - name: Upload beta APKs
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-subtitle-beta-apks-${{ github.run_number }}
          path: smarttubetv/build/outputs/apk/stbeta/release/*.apk
          if-no-files-found: error

  preference-tests:
    name: Settings and secret tests (JDK 11)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code and submodules
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "11"
          distribution: temurin
          cache: gradle

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Run AI subtitle preference tests
        run: ./gradlew :common:testStbetaDebugUnitTest --tests "com.liskovsoft.smartyoutubetv2.common.ai.subtitle.settings.*"

      - name: Upload preference test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-subtitle-preference-reports-${{ github.run_number }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: warn

  publish-prerelease:
    name: Publish AI subtitle test pre-release
    if: startsWith(github.ref, 'refs/tags/ai-subtitle-test-')
    needs:
      - validate
      - preference-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download beta APK
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ai-subtitle-beta-apks-${{ github.run_number }}
          path: release-assets

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if gh release view "$TAG_NAME" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/*.apk \
              --repo "$REPOSITORY" \
              --clobber
          else
            gh release create "$TAG_NAME" release-assets/*.apk \
              --repo "$REPOSITORY" \
              --target "$COMMIT_SHA" \
              --title "SmartTube AI bilingual subtitles — $TAG_NAME" \
              --notes "Test pre-release built by AI Subtitle Validation run #$RUN_NUMBER. Install only for manual testing." \
              --prerelease
          fi
