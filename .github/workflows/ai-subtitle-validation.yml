name: AI Subtitle Validation

on:
  push:
    branches:
      - feature/ai-bilingual-subtitles
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-subtitle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint, and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code and submodules
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Run common unit tests
        run: ./gradlew :common:testStbetaDebugUnitTest

      - name: Lint beta release
        run: ./gradlew lintStbetaRelease

      - name: Assemble beta release
        run: ./gradlew assembleStbetaRelease

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-subtitle-validation-reports-${{ github.run_number }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          if-no-files-found: warn

      - name: Upload beta APKs
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-subtitle-beta-apks-${{ github.run_number }}
          path: smarttubetv/build/outputs/apk/stbeta/release/*.apk
          if-no-files-found: error

  preference-tests:
    name: Preference tests (JDK 11)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code and submodules
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "11"
          distribution: temurin
          cache: gradle

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Run AI subtitle preference tests
        run: ./gradlew :common:testStbetaDebugUnitTest --tests com.liskovsoft.smartyoutubetv2.common.ai.subtitle.settings.AiSubtitleDataTest

      - name: Upload preference test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-subtitle-preference-reports-${{ github.run_number }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: warn
